# Maxieye 数据协作平台 · nginx 反向代理
# 安装位置：/etc/nginx/sites-available/data-label（软链到 sites-enabled/）
# 作用：让访问地址变成 http://10.2.248.6/（不再带 :3001），并支持大文件上传
server {
    listen 80;
    listen [::]:80;
    server_name 10.2.248.6;

    # 验收数据导入/附件上传：应用侧 50MB，这里留出余量
    client_max_body_size 60m;
    client_body_timeout 300s;

    # 访问日志（排障用）
    access_log /var/log/nginx/data-label.access.log;
    error_log  /var/log/nginx/data-label.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大 Excel 解析/导出耗时较长，放宽超时
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 上传下载不缓冲，避免大文件占用磁盘
        proxy_request_buffering off;
        proxy_buffering         off;
    }
}
