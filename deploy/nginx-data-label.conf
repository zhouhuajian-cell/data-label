# Maxieye 数据协作平台 · nginx 站点配置
# 安装位置：/etc/nginx/sites-available/data-label（软链到 sites-enabled/）
# 作用：让访问地址变成 http://10.2.248.6/（不再带 :3001）、压缩文本资源、静态文件直出
server {
    listen 80;
    listen [::]:80;
    server_name 10.2.248.6;

    # 验收数据导入/附件上传：应用侧 50MB，这里留出余量
    client_max_body_size 60m;
    client_body_timeout 300s;

    # ===== gzip 压缩 =====
    # 未压缩时首屏要传 ~1.7MB（element-plus 754KB + vendor 458KB + CSS），
    # 在限速/远程链路上单文件就要 400ms；开 gzip 后体积约为 1/3~1/4。
    # 注意 gzip_types 必须显式列出：默认只压 text/html，JS/CSS/JSON 都不会被压缩。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        application/wasm;

    # 访问日志（排障用）
    access_log /var/log/nginx/data-label.access.log;
    error_log  /var/log/nginx/data-label.error.log;

    # 入口 HTML 不缓存：否则刷新后仍加载旧的打包分包（重新部署后看不到新界面）
    location = /index.html {
        root /opt/data_label/dist;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # 带内容哈希的静态资源：nginx 直接读文件（不再经 node 转发），可长缓存
    location /assets/ {
        root /opt/data_label/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        # 接口不缓存，避免刷新后仍加载旧数据
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大 Excel 解析/导出耗时较长，放宽超时
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 上传/下载都不缓冲，避免大文件（明细导出、附件）占用服务器磁盘
        proxy_request_buffering off;
        proxy_buffering         off;
    }
}
